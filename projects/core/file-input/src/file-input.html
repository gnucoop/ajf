<div ajfDnd (file)="onFileDrop($event)" class="ajf-drop-zone">
  @if (emptyFile) {
    <div class="ajf-drop-message" (click)="triggerNativeInput()">
      @if (_dropMessageChildren.length) {
        <ng-content select="[ajfDropMessage]"></ng-content>
      } @else {
        {{ 'Drop your file here or click to select' | transloco }}
      }
    </div>
  } @else {
    <div class="ajf-file-info">
      @if (_filePreviewChildren.length) {
        <ng-content select="[ajfFilePreview]"></ng-content>
      } @else {
        <div class="ajf-file-info-content">
          <img [src]="fileIcon" alt="" />
          <div class="ajf-file-name">{{ value?.name }}</div>
          @if (sizeLabel) {
            <div class="ajf-file-size">{{ sizeLabel }}</div>
          }
        </div>
      }
    </div>
    <div class="ajf-file-actions">
      <button type="button" class="ajf-replace-file" (click)="triggerNativeInput()">
        {{ 'Replace' | transloco }}
      </button>
      <button type="button" class="ajf-remove-file" (click)="resetValue()">
        {{ 'Remove' | transloco }}
        <div class="ajf-screen-reader-only">{{ 'Delete' | transloco }}</div>
      </button>
    </div>
  }
</div>
<input
  #nativeInput
  [accept]="accept"
  name=""
  aria-label="file input"
  type="file"
  (change)="onSelectFile()"
/>
