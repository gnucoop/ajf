<ng-container *ngIf="control | async as ctrl">
  <span class="ajf-input-group ajf-control--mono">
    <input
      [matDatepicker]="picker"
      [attr.aria-label]="instance! | ajfNodeCompleteName"
      [min]="instance!.node.minDate | ajfDateValueString"
      [max]="instance!.node.maxDate | ajfDateValueString"
      [formControl]="ctrl!"
      readonly
    />
    <mat-datepicker-toggle class="ajf-input-group-action" [for]="picker"></mat-datepicker-toggle>
  </span>
  <mat-datepicker #picker>
    <mat-datepicker-actions>
      <button mat-button type="button" (click)="clear(ctrl); picker.close()">
        {{ 'Clear' | transloco }}
      </button>
      <button mat-raised-button color="primary" matDatepickerApply>{{ 'OK' | transloco }}</button>
    </mat-datepicker-actions>
  </mat-datepicker>
</ng-container>
