@if (control | async; as ctrl) {
  @switch (instance?.node?.fieldType) {
    <!-- String  -->
    @case (0) {
      <span>{{ ctrl.value }}</span>
    }
    <!-- Textarea with HTML  -->
    @case (1) {
      <div [innerHTML]="ctrl.value | safeHtml"></div>
    }
    <!-- Number  -->
    @case (2) {
      <span>{{ ctrl.value | number }}</span>
    }
    <!-- Boolean  -->
    @case (3) {
      <mat-slide-toggle
        [checked]="ctrl.value"
        (click)="$event.preventDefault()"
        (change)="$event.source.checked = ctrl.value"
        [disableRipple]="true"
      >
      </mat-slide-toggle>
    }
    <!-- Default -->
    @default {
      <span>{{ ctrl.value }}</span>
    }
  }
}
