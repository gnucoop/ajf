@if (control | async; as ctrl) {
  <input class="ajf-control ajf-video-input" type="url" [formControl]="ctrl!" />
  <div class="ajf-video-thumbnail">
    @if (validUrl | async) {
      <a target="_blank" [href]="ctrl.value">
        @if (videoThumbnail | async; as thumb) {
          <img [src]="thumb" alt="" />
        }
      </a>
    }
  </div>
}
