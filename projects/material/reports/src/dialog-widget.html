@if (instance) {
  <a class="ajf-dialog-toggle" (click)="openDialog()">
    <ajf-widget [instance]="instance.toggle"></ajf-widget>
  </a>
}
<ng-template #dialogContent>
  @if (instance) {
    @for (item of instance.content; track item) {
      <ajf-widget [instance]="item"></ajf-widget>
    }
  }
</ng-template>
