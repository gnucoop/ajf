@if (instance) {
  <div class="ajf-columns">
    @for (column of instance.widget.columns; track column; let idx = $index) {
      <div
        [ngStyle]="{'flex-grow': column > -1 ? 1 : null, 'flex-basis' : column > -1 ? (column * 100) + '%' : null}"
        class="ajf-column"
      >
        @if (allcolumnsRendered$|async) {
          @if ((instance|ajfGetColumnContent:idx); as cc) {
            <ajf-widget [instance]="cc!"> </ajf-widget>
          }
        }
      </div>
    }
  </div>
}
