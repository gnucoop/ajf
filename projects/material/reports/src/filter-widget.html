@if (instance) {
  @if (instance.filter; as filter) {
    <div class="ajf-filter-container">
      <ajf-form
        [form]="filter.form"
        [hasStartMessage]="false"
        [hasEndMessage]="false"
        [hideTopToolbar]="true"
        [hideBottomToolbar]="true"
        [hideNavigationButtons]="true"
      ></ajf-form>
      <div class="ajf-filter-actions">
        <button type="button" class="ajf-btn ajf-btn--primary" (click)="applyFilter()">
          {{ 'Apply filter' | transloco }}
        </button>
      </div>
    </div>
  }
}
