@if (instance) {
  @if (instance.filter; as filter) {
    <div class="ajf-filter-container">
      <ajf-form
        [form]="filter.form"
        [hasStartMessage]="false"
        [hasEndMessage]="false"
        [hideTopToolbar]="true"
        [hideBottomToolbar]="true"
        [hideNavigationButtons]="true"
      ></ajf-form>
    </div>
  }
}
