<div class="ajf-editor">
  <mat-form-field class="ajf-formula-editor">
    <code><input matInput type="text" [formControl]="formulaEditorControl" /></code>
  </mat-form-field>
</div>
<div class="ajf-editor-panel">
  @if (fields; as curFields) {
    @if (curFields!.length > 0) {
      <mat-nav-list dense>
        @for (field of curFields!; track field) {
          <a mat-list-item (click)="insertVariable(field.name)" [matTooltip]="field.label">
            <ajf-node-icon [node]="field"></ajf-node-icon>
            {{ field.name }}
          </a>
        }
      </mat-nav-list>
    }
  }
</div>
