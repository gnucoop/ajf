<h3 matDialogTitle>{{'Edit condition'|transloco}}</h3>
<mat-dialog-content>
  <mat-form-field>
    <mat-label>{{ 'Error message' | transloco }}</mat-label>
    <input matInput [(ngModel)]="errorMessage" />
  </mat-form-field>
  @if (fields|async; as curFields) {
    <ajf-condition-editor [fields]="curFields!" [condition]="condition"></ajf-condition-editor>
  }
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="saveCondition()">{{'Save'|transloco}}</button>
  <button mat-button (click)="closeDialog()">{{'Close'|transloco}}</button>
</mat-dialog-actions>
