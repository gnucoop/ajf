@switch (imageType|async) {
  @case (imageTypes.Image) {
    @if (url|async; as iu) {
      <img [src]="iu" alt="" />
    }
  }
  @case (imageTypes.Icon) {
    @if (iconObj|async; as io) {
      <mat-icon [fontSet]="io!.fontSet" [fontIcon]="io!.fontIcon"> </mat-icon>
    }
  }
  @case (imageTypes.Flag) {
    <span [class]="flagName|async"></span>
  }
}
