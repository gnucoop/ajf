<div class="ajf-time">
  <mat-select
    class="ajf-time-select"
    panelClass="ajf-time-panel"
    [(ngModel)]="hours"
    (opened)="focusHandler()"
    placeholder="HH"
  >
    @for (h of hoursList; track h) {
      <mat-option [value]="h"> {{ h | number : '2.0' }} </mat-option>
    }
  </mat-select>
  <span class="ajf-time-sep">:</span>
  <mat-select
    class="ajf-time-select"
    panelClass="ajf-time-panel"
    [(ngModel)]="minutes"
    (opened)="focusHandler()"
    placeholder="MM"
  >
    @for (m of minutesList; track m) {
      <mat-option [value]="m"> {{ m | number : '2.0' }} </mat-option>
    }
  </mat-select>
  <mat-icon class="ajf-time-icon">schedule</mat-icon>
</div>
