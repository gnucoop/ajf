<h1>Transloco Example</h1>
<section>
  <mat-form-field>
    <mat-label>Select a language</mat-label>
    <mat-select (selectionChange)="selectLang($event)" [value]="langs[0]">
      @for (lang of langs; track lang) {
        <mat-option [value]="lang">{{ lang }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  @for (str of strings; track str) {
    <div class="test-string">{{ str|transloco }}</div>
  }
</section>
