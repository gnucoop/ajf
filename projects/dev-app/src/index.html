<!doctype html>

     already light: the dev app opens on its light palette whatever the browser
     asks for, and the menu's theme toggle takes it from there. -->
<html lang="en" class="ajf-light">
<head>
  <meta charset="utf-8">
  <title>DevApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
  <dev-app></dev-app>
</body>
</html>
